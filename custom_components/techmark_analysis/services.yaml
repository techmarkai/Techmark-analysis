generate_report:
  fields:
    period:
      required: true
      selector:
        select:
          options:
            - day
            - month
    date:
      required: false
      selector:
        date:
list_faces:
  fields:
    library:
      required: true
      selector:
        select:
          options:
            - employee
            - customer
export_attendance:
  fields:
    range:
      required: true
      selector:
        select:
          options:
            - today
            - yesterday
            - this_week
            - this_month
            - custom
    start_date:
      required: false
      selector:
        date:
    end_date:
      required: false
      selector:
        date:
export_visitors:
  fields:
    report:
      required: true
      selector:
        select:
          options:
            - visitor
            - annual
            - monthly
    year:
      required: false
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    visitor_id:
      required: false
      selector:
        number:
          min: 1
          mode: box
