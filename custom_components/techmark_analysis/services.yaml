generate_report:
  fields:
    period:
      required: true
      selector:
        select:
          options:
            - day
            - month
    date:
      required: false
      selector:
        date:
list_faces:
  fields:
    library:
      required: true
      selector:
        select:
          options:
            - employee
            - customer
export_attendance:
  fields:
    range:
      required: true
      selector:
        select:
          options:
            - today
            - yesterday
            - this_week
            - this_month
            - custom
    start_date:
      required: false
      selector:
        date:
    end_date:
      required: false
      selector:
        date:
